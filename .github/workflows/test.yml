name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the ephemeris, window and code tests
        run: npm test
      # Byte-comparing the PNGs would flake across zlib versions, so this just
      # confirms the mark still renders from source.
      - name: Confirm the icons still render from source
        run: python3 tools/make-icons.py
