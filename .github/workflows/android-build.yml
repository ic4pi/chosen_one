name: Android — build signed release bundle

# Manual trigger: Actions tab -> this workflow -> Run workflow.
# Produces a signed app-release.aab ready to upload to Play Console.
# Requires the four ANDROID_* secrets from android-generate-keystore.yml
# to already be set in Settings -> Secrets and variables -> Actions.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies and render icons
        run: |
          npm ci
          npm run icons

      - name: Generate the Android project
        run: npm run android:add

      - name: Ensure the required SDK platform and build-tools are installed
        run: |
          set -euo pipefail
          COMPILE_SDK="$(grep -oP 'compileSdkVersion\s*=\s*\K[0-9]+' android/variables.gradle)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-$COMPILE_SDK" "build-tools;$COMPILE_SDK.0.0" || \
            "$SDKMANAGER" "platforms;android-$COMPILE_SDK"

      - name: Wire up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Run the" \
                 "'Android — generate release keystore' workflow first and add" \
                 "the four ANDROID_* secrets it prints (Settings > Secrets and" \
                 "variables > Actions)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/kundala-upload.jks
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("kundala-upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kundala-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
