name: Android — generate release keystore

# Run this ONCE. It creates the private key that signs every future Play
# Store release of Kundala — if you lose it, you can never update the app
# again under the same listing. It never leaves GitHub except as a
# workflow artifact only you (a repo collaborator) can download.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and random passwords
        run: |
          set -euo pipefail
          STOREPASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"
          ALIAS="kundala"
          keytool -genkeypair -v \
            -keystore kundala-upload.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=Kundala, OU=Kundala, O=Kundala, L=Unknown, ST=Unknown, C=US"
          base64 -w0 kundala-upload.jks > kundala-upload.jks.b64
          {
            echo "Add these four as repository secrets:"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo
            echo "ANDROID_KEYSTORE_BASE64 = (contents of kundala-upload.jks.b64, this whole file as one line)"
            echo "ANDROID_KEYSTORE_PASSWORD = $STOREPASS"
            echo "ANDROID_KEY_ALIAS = $ALIAS"
            echo "ANDROID_KEY_PASSWORD = $STOREPASS"
            echo
            echo "Also keep kundala-upload.jks and this file somewhere safe, off GitHub,"
            echo "forever. It is the only thing that can sign an update to this app."
          } > README-KEEP-THIS-SAFE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kundala-keystore-KEEP-PRIVATE
          path: |
            kundala-upload.jks
            kundala-upload.jks.b64
            README-KEEP-THIS-SAFE.txt
          retention-days: 1
